server {
    listen 80;
    server_name localhost;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory for static React SPA files
    root /usr/share/nginx/html;
    index index.html;

    # 1. React SPA Client-Side Routing Support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy REST API Requests to Backend Service
    location /api/ {
        proxy_pass http://backend:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy Socket.IO Real-Time WebSocket Connections
    location /socket.io/ {
        proxy_pass http://backend:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for low-latency WebSocket frames
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
